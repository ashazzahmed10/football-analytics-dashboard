<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PitchIQ Analytics</title>
  <meta name="description" content="Event-level football analytics engine: xG, xT, Dixon-Coles, Monte Carlo, pass networks and scouting." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%233987e5'/><circle cx='16' cy='16' r='7' fill='none' stroke='white' stroke-width='2.5'/></svg>" />
  <link rel="stylesheet" href="/static/css/styles.css" />
  <script>
    try { const t = localStorage.getItem("pitchiq-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">IQ</div>
        <div>
          <div class="brand-name">PitchIQ</div>
          <div class="brand-sub">Football analytics engine</div>
        </div>
      </div>
      <nav class="nav" id="nav">
        <div class="nav-label">League</div>
        <a href="#/overview" data-route="overview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Overview</a>
        <a href="#/matches" data-route="matches"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="12" y1="5" x2="12" y2="19"/><circle cx="12" cy="12" r="3"/></svg>Match Centre</a>
        <a href="#/live" data-route="live"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="2"/><path d="M16.2 7.8a6 6 0 0 1 0 8.4M7.8 16.2a6 6 0 0 1 0-8.4M19.1 4.9a10 10 0 0 1 0 14.2M4.9 19.1a10 10 0 0 1 0-14.2"/></svg>Live Simulator</a>
        <div class="nav-label">Models</div>
        <a href="#/xg" data-route="xg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>xG Lab</a>
        <a href="#/xt" data-route="xt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>Expected Threat</a>
        <a href="#/predict" data-route="predict"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 6-7"/></svg>Match Predictor</a>
        <a href="#/season" data-route="season"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4Z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>Season Simulator</a>
        <a href="#/models" data-route="models"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.7 3h10.6a2 2 0 0 0 1.7-3l-5-9V3"/></svg>Model Validation</a>
        <div class="nav-label">Players</div>
        <a href="#/scouting" data-route="scouting"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>Scouting Lab</a>
        <div class="nav-label">System</div>
        <a href="#/architecture" data-route="architecture"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="6" height="6" rx="1"/><rect x="15" y="3" width="6" height="6" rx="1"/><rect x="9" y="15" width="6" height="6" rx="1"/><path d="M6 9v3h12V9M12 12v3"/></svg>Architecture & API</a>
      </nav>
      <div class="sidebar-foot">
        <div><span class="status-dot"></span><span id="api-status">Connecting…</span></div>
        <div id="api-latency" class="mono">–</div>
        <a href="/docs" target="_blank" rel="noopener">OpenAPI docs ↗</a>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-btn" aria-label="Menu"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
        <div>
          <h1 id="page-title">Overview</h1>
          <div class="subtitle" id="page-sub"></div>
        </div>
        <div class="spacer"></div>
        <span class="chip" id="md-chip">Matchday –</span>
        <button class="icon-btn" id="theme-btn" aria-label="Toggle theme" title="Toggle light/dark">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        </button>
      </header>
      <section class="content" id="view"></section>
    </main>
  </div>
  <div class="tooltip" id="tooltip"></div>
  <script src="/static/vendor/d3.min.js"></script>
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
